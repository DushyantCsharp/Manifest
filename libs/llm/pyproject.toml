[project]
name = "manifest-llm"
version = "0.1.0"
description = "The only gateway to LLM providers: client, shared token bucket, structured output."
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.13.0",
    "httpx>=0.28.1",
    "manifest-domain",
    "manifest-telemetry",
    "pydantic>=2.14.1",
    "redis>=8.1.0",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12"]
build-backend = "uv_build"
