[project]
name = "manifest-db"
version = "0.1.0"
description = "SQLAlchemy 2.0 async models, sessions and Alembic migrations."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "manifest-domain",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.4",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12"]
build-backend = "uv_build"
