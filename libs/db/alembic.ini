[alembic]
script_location = %(here)s/src/manifest_db/migrations
file_template = %%(rev)s_%%(slug)s
path_separator = os
timezone = UTC
# sqlalchemy.url is not set here: env.py reads MANIFEST_DB_URL via DatabaseSettings.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
