[project]
name = "manifest-evals"
version = "0.1.0"
description = "Eval harness: golden packs, labels, calibration metrics."
requires-python = ">=3.12,<3.13"
dependencies = [
    "manifest-domain",
    "manifest-llm",
    "manifest-hs",
    "manifest-worker",
    "faker>=40.43.0",
    "jinja2>=3.1.6",
    "weasyprint>=70.0",
    "pypdfium2>=5.14.0",
    "pillow>=12.3.0",
    "numpy>=2.5.4",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12"]
build-backend = "uv_build"
