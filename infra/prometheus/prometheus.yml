global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Application metrics: services push OTLP to the collector, which re-exposes them here.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Queue depth, unacked and redelivered counts — the backpressure signals.
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
