# Local stack for Manifest. `make up` / `make down` / `make nuke`.
# Host ports bind to 127.0.0.1 only and are overridable via .env (see .env.example).
name: manifest

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_USER: manifest
      POSTGRES_PASSWORD: manifest
      POSTGRES_DB: manifest
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5440}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manifest -d manifest"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3.6-management
    hostname: rabbitmq # node name (and so its data dir) must survive container recreation
    environment:
      RABBITMQ_DEFAULT_USER: manifest
      RABBITMQ_DEFAULT_PASS: manifest
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.8
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Official MinIO images are no longer published to Docker Hub; pgsty/* is a maintained
  # community build of the same server and client.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: manifest
      MINIO_ROOT_PASSWORD: manifest-secret
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot bucket creation. In a profile because `up --wait` treats any exited container as
  # a failure; `make up` runs it explicitly once the stack is healthy.
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    profiles: ["init"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 manifest manifest-secret &&
        mc mb --ignore-existing local/manifest-documents
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"
    depends_on:
      - tempo
    restart: unless-stopped

  # Tempo runs as uid 10001 and its image is distroless (no chown), so a busybox one-shot
  # hands the named volume to that uid before Tempo starts.
  tempo-init:
    image: busybox:1.37
    user: root
    entrypoint: ["chown", "10001:10001", "/var/tempo"]
    volumes:
      - tempo-data:/var/tempo
    restart: "no"

  tempo:
    image: grafana/tempo:2.10.8
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    depends_on:
      tempo-init:
        condition: service_completed_successfully
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - tempo
    restart: unless-stopped

  # ---------------------------------------------------------------- the app (profile "app")
  # The release images (services/*/Dockerfile), wired to the services above:
  #   docker compose -f infra/compose.yaml --profile app up -d --build
  # `make up` doesn't start them; `make api` / `make worker` run on the host instead. No model
  # keys are passed in: set ANTHROPIC_API_KEY / VOYAGE_API_KEY in your shell to call models.
  api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    image: manifest-api:local
    environment: &app-environment
      MANIFEST_DB_URL: postgresql+asyncpg://manifest:manifest@postgres:5432/manifest
      MANIFEST_BROKER_URL: amqp://manifest:manifest@rabbitmq:5672//
      MANIFEST_RESULT_BACKEND_URL: redis://redis:6379/1
      MANIFEST_REDIS_URL: redis://redis:6379/0
      MANIFEST_S3_ENDPOINT_URL: http://minio:9000
      # Presigned upload URLs are for clients on the host.
      MANIFEST_S3_PUBLIC_ENDPOINT_URL: http://localhost:${MINIO_PORT:-9000}
      MANIFEST_RABBITMQ_API_URL: http://rabbitmq:15672/api
      MANIFEST_ENVIRONMENT: ${MANIFEST_ENVIRONMENT:-local}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
    command: ["uvicorn", "manifest_api.main:app", "--host", "0.0.0.0", "--port", "8010", "--workers", "${API_WORKERS:-2}"]
    ports:
      - "127.0.0.1:${API_PORT:-8010}:8010"
    depends_on: &app-dependencies
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  worker:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: services/worker/Dockerfile
    image: manifest-worker:local
    environment: *app-environment
    command:
      - celery
      - -A
      - manifest_worker.app:celery_app
      - worker
      - --loglevel=INFO
      - --without-gossip
      - --without-mingle
      - --concurrency=${WORKER_CONCURRENCY:-8}
    depends_on: *app-dependencies
    restart: unless-stopped

  # Exactly one: it samples queue depths and the review queue for everyone.
  monitor:
    profiles: ["app"]
    image: manifest-worker:local
    environment: *app-environment
    command: ["python", "-m", "manifest_worker.monitor"]
    depends_on:
      worker:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  minio-data:
  tempo-data:
  prometheus-data:
  grafana-data:
