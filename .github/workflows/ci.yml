# Lint, types, tests (unit, integration on service containers, Alembic up/down), contract
# drift and a schemathesis smoke. Docs-only changes skip the jobs; `ci-ok` is the one check to
# require in branch protection, and it passes when they were skipped.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.11.14"
  PYTHON_VERSION: "3.12"
  HYPOTHESIS_PROFILE: ci
  FORCE_COLOR: "1"

jobs:
  changes:
    name: what changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read  # paths-filter lists a PR's files through the API
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          # A file is code unless it is documentation: it must match every pattern.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE*'

  lint:
    name: ruff + import contracts
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: make lint

  typecheck:
    name: mypy --strict
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: make typecheck

  unit:
    name: unit tests + coverage
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install Pango (WeasyPrint renders the synthetic packs)
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0
      - run: uv sync --locked
      - run: make test

  integration:
    name: integration tests + migrations
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    # The images conftest.py starts locally through testcontainers (pinned here by digest);
    # it uses these instead.
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: manifest
          POSTGRES_PASSWORD: manifest
          POSTGRES_DB: manifest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U manifest -d manifest"
          --health-interval 5s --health-timeout 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:4.3.6-management@sha256:8dd6e3570ddaa2ef82a6c3a8950e79c1f73893adfbdddbc374fc1f1ac8a0f5dd
        env:
          RABBITMQ_DEFAULT_USER: manifest
          RABBITMQ_DEFAULT_PASS: manifest
        ports: ["5672:5672", "15672:15672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 5s --health-timeout 10s --health-retries 30
      redis:
        image: redis:8.8@sha256:eb1aa641bc5380ed14442398e45a5a51aeaaac919fab811e4f134eb77c71dd2d
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MANIFEST_DB_URL: postgresql+asyncpg://manifest:manifest@localhost:5432/manifest
      MANIFEST_TEST_POSTGRES_URL: postgresql+asyncpg://manifest:manifest@localhost:5432/manifest
      MANIFEST_TEST_REDIS_URL: redis://localhost:6379/0
      MANIFEST_TEST_AMQP_URL: amqp://manifest:manifest@localhost:5672/
      MANIFEST_TEST_RABBITMQ_API: http://localhost:15672/api
      MANIFEST_TEST_S3_ENDPOINT: http://localhost:9000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # A service container can't be given a command, and MinIO needs `server /data`.
      - name: Start MinIO
        run: |
          docker run --detach --name minio --publish 9000:9000 \
            --env MINIO_ROOT_USER=manifest --env MINIO_ROOT_PASSWORD=manifest-secret \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 \
            server /data
          for _ in $(seq 60); do
            curl --silent --fail http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          docker logs minio
          exit 1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - name: Alembic up, drift check, down to base, up again
        run: |
          alembic() { uv run alembic -c libs/db/alembic.ini "$@"; }
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - run: make test-integration

  contracts:
    name: contract drift
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      # openapi-typescript regenerates the review UI's REST types.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/review/package-lock.json
      - run: uv sync --locked
      - run: make contracts-check

  schemathesis:
    name: schemathesis smoke
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SCHEMATHESIS_MAX_EXAMPLES: "25"  # a smoke; `make test-contract` locally runs 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: make test-contract

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, lint, typecheck, unit, integration, contracts, schemathesis]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed or was skipped as docs-only
        env:
          BROKEN: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [[ "$BROKEN" == "true" ]]; then
            echo "::error::a CI job failed or was cancelled"
            exit 1
          fi
