# On a version tag (v1.2.3): build the api and worker images, smoke-test them, gate on Trivy
# (no fixable CRITICAL CVE), and only when both images pass, build them for amd64 and arm64
# and push to GHCR with an SBOM and max-mode provenance attestations.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

# Releases queue rather than cancel: a cancelled push could leave a half-published tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TRIVY_VERSION: v0.74.0

jobs:
  scan:
    name: build + scan ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        image: [api, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Build (amd64, loaded for the checks below)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: services/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          load: true
          tags: manifest-${{ matrix.image }}:scan
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Smoke test the API image
        if: matrix.image == 'api'
        run: |
          docker run --detach --name api --publish 8010:8010 manifest-api:scan
          for _ in $(seq 30); do
            curl --silent --fail http://localhost:8010/healthz && break
            sleep 1
          done
          curl --silent --fail http://localhost:8010/healthz
          [[ "$(docker exec api id -u)" != "0" ]]
          if docker exec api sh -c 'command -v tesseract'; then
            echo "::error::tesseract belongs in the worker image only"
            exit 1
          fi
      - name: Smoke test the worker image (OCR a scanned golden page)
        if: matrix.image == 'worker'
        run: |
          [[ "$(docker run --rm manifest-worker:scan id -u)" != "0" ]]
          docker run --rm --volume "$PWD/evals/golden/scan-0001:/pack:ro" manifest-worker:scan \
            python -c '
          from manifest_domain import calibration
          from manifest_worker.app import celery_app
          from manifest_worker.text import split_pages, tesseract_ocr
          [page] = split_pages(open("/pack/commercial_invoice.pdf", "rb").read())
          assert "INVOICE" in tesseract_ocr(page).upper()
          assert calibration.versions("extraction") and celery_app.main == "manifest"
          '
      - name: Trivy gate (fixable CRITICAL CVEs fail the release)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: manifest-${{ matrix.image }}:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      # Unfixed CVEs can't block a release (nothing to upgrade to), but they are listed.
      - name: Trivy report (CRITICAL and HIGH, fixed or not)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          image-ref: manifest-${{ matrix.image }}:scan
          severity: CRITICAL,HIGH
          exit-code: "0"
          output: trivy.txt
      - name: Add the report to the job summary
        if: ${{ !cancelled() }}
        env:
          IMAGE: manifest-${{ matrix.image }}
        run: |
          {
            echo "### Trivy: $IMAGE"
            echo '```'
            cat trivy.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: publish ${{ matrix.image }}
    needs: scan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write  # push the images to GHCR
    strategy:
      matrix:
        image: [api, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (GHCR wants lower case)
        id: image
        env:
          IMAGE: manifest-${{ matrix.image }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Build for amd64 and arm64 and push, with SBOM and provenance
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: services/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
