[project]
name = "manifest-review-client"
version = "0.1.0"
description = "Typed client for the reviewer GraphQL API, generated by ariadne-codegen. Used by integration tests."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12"]
build-backend = "uv_build"

# src/ is generated from these settings by `make contracts`; never edit it by hand.
# Paths are relative to this directory (scripts/contracts.py runs the generator here).
[tool.ariadne-codegen]
schema_path = "../../contracts/schema.graphql"
queries_path = "queries"
target_package_name = "manifest_review_client"
target_package_path = "src"
files_to_include = ["scalars.py"]

[tool.ariadne-codegen.scalars.Decimal]
type = "decimal.Decimal"

[tool.ariadne-codegen.scalars.Date]
type = ".scalars.IsoDate"

[tool.ariadne-codegen.scalars.DateTime]
type = ".scalars.IsoDateTime"
